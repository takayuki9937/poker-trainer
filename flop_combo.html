<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ボード コンボ計算機</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d0d0f; --surface:#16161a; --surface2:#1e1e24;
    --border:rgba(255,255,255,.08); --border2:rgba(255,255,255,.15);
    --text:#f0efe8; --muted:#7a7a8a;
    --red:#e03030; --green:#1d9e75; --amber:#d4861a; --blue:#2a7be4;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace,sans-serif;min-height:100vh;}

  header{padding:24px 36px 18px;border-bottom:.5px solid var(--border);display:flex;align-items:baseline;gap:14px;}
  header h1{font-family:'Syne',sans-serif;font-size:20px;font-weight:800;letter-spacing:-.5px;}
  header span{font-size:11px;color:var(--muted);letter-spacing:.08em;}
  .wrap{padding:32px 36px;max-width:980px;}

  /* ── カードスロット ── */
  .board-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;}
  .board-group{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
  .group-label{font-size:9px;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;
               margin-bottom:8px;padding-bottom:6px;border-bottom:.5px solid var(--border);}

  .card-slot{background:var(--surface);border:.5px solid var(--border);border-radius:8px;padding:14px;width:160px;transition:opacity .2s;}
  .card-slot.disabled{opacity:.35;pointer-events:none;}
  .slot-label{font-size:9px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px;}

  .rank-row{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:7px;}
  .rb{font-size:10px;font-weight:500;width:26px;height:26px;display:flex;align-items:center;justify-content:center;
      background:var(--surface2);border:.5px solid var(--border);border-radius:3px;color:var(--muted);cursor:pointer;transition:all .1s;}
  .rb:hover{color:var(--text);border-color:var(--border2);}
  .rb.active{border-color:var(--border2);color:var(--text);}

  .suit-row{display:flex;gap:3px;margin-bottom:9px;}
  .sb{font-size:15px;width:32px;height:32px;display:flex;align-items:center;justify-content:center;
      background:var(--surface2);border:.5px solid var(--border);border-radius:3px;cursor:pointer;transition:all .1s;opacity:.4;}
  .sb:hover{opacity:.75;border-color:var(--border2);}
  .sb.active{opacity:1;border-color:var(--border2);}
  .sb.red{color:#e03030;}

  .cd{display:inline-flex;align-items:center;justify-content:center;width:44px;height:59px;
      background:#fff;border-radius:5px;font-size:16px;font-weight:700;color:#111;
      flex-direction:column;line-height:1;}
  .cd .sc{font-size:10px;}
  .cd.rc{color:#c8230a;}
  .cd.empty{background:var(--surface);color:var(--muted);font-size:12px;border:.5px dashed var(--border2);}

  .reset-btn{font-size:11px;padding:7px 16px;background:none;border:.5px solid var(--border2);
             border-radius:4px;color:var(--muted);cursor:pointer;transition:color .1s;margin-bottom:28px;}
  .reset-btn:hover{color:var(--text);}

  /* ── 結果 ── */
  #result{display:none;}
  .result-title{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:14px;}
  table{width:100%;border-collapse:collapse;max-width:580px;}
  td,th{padding:8px 10px;text-align:left;font-size:12px;}
  th{color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border-bottom:.5px solid var(--border);}
  tr.hand-row td{border-bottom:.5px solid var(--border);}
  .num{text-align:right;font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;}
  .pct{text-align:right;color:var(--muted);width:56px;}
  .bar-cell{width:160px;}
  .bar-wrap{background:var(--surface2);border-radius:2px;height:5px;overflow:hidden;}
  .bar-fill{height:100%;border-radius:2px;transition:width .3s;}
  .sf    .bar-fill{background:var(--amber);}
  .quads .bar-fill{background:var(--amber);}
  .fh    .bar-fill{background:var(--red);}
  .flush .bar-fill{background:var(--blue);}
  .str   .bar-fill{background:var(--green);}
  .trips .bar-fill{background:var(--red);}
  .twopair .bar-fill{background:var(--blue);}
  .pair  .bar-fill{background:var(--muted);}
  .high  .bar-fill{background:var(--border2);}
  tr.divider td{padding:0;height:1px;background:var(--border2);}
  tr.total-row td{background:var(--surface2);font-weight:500;}
  tr.twoplus-row td{background:rgba(42,123,228,.08);border-top:.5px solid rgba(42,123,228,.3);border-bottom:.5px solid rgba(42,123,228,.3);}
  tr.twoplus-row .tname{color:var(--blue);}
  .hand-name{min-width:150px;}
  @media(max-width:640px){.wrap{padding:16px;}.card-slot{width:140px;}.bar-cell{display:none;}}
</style>
</head>
<body>
<header>
  <h1>ボード コンボ計算機</h1>
  <span>フロップ / ターン / リバー対応</span>
</header>

<div class="wrap">
  <div class="board-row" id="board-row"></div>
  <button class="reset-btn" onclick="resetAll()">&#x21BA; リセット</button>

  <div id="result">
    <div class="result-title" id="result-title"></div>
    <table>
      <thead>
        <tr>
          <th class="hand-name">ハンド</th>
          <th style="text-align:right">コンボ</th>
          <th style="text-align:right">%</th>
          <th class="bar-cell"></th>
        </tr>
      </thead>
      <tbody id="result-body"></tbody>
    </table>
  </div>
</div>

<script>
// ── 定数 ──────────────────────────────────────────────────────
const RANKS = ['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
const SUITS = ['s','h','d','c'];
const SC    = {s:'♠', h:'♥', d:'♦', c:'♣'};
const RED   = new Set(['h','d']);
const RV    = {A:14,K:13,Q:12,J:11,T:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2};

const FULL_DECK = [];
for (const r of RANKS) for (const s of SUITS) FULL_DECK.push({r, s, v: RV[r]});

// スロット定義
const SLOT_INFO = [
  {label:'フロップ 1', group:'flop'},
  {label:'フロップ 2', group:'flop'},
  {label:'フロップ 3', group:'flop'},
  {label:'ターン',     group:'turn'},
  {label:'リバー',     group:'river'},
];

// ── 状態 ──────────────────────────────────────────────────────
const board = Array.from({length: 5}, () => ({r: null, s: null}));

// ── ヘルパー ─────────────────────────────────────────────────
function completedCount() {
  let n = 0;
  for (let i = 0; i < 5; i++) {
    if (board[i].r && board[i].s) n++;
    else break;
  }
  return n;
}

function usedSet(excludeIdx = -1) {
  const s = new Set();
  board.forEach((c, i) => { if (i !== excludeIdx && c.r && c.s) s.add(c.r + c.s); });
  return s;
}

// ── UI 構築 ──────────────────────────────────────────────────
function buildUI() {
  const container = document.getElementById('board-row');
  container.innerHTML = '';

  for (let i = 0; i < 5; i++) {
    const info  = SLOT_INFO[i];
    const slot  = document.createElement('div');
    slot.className = 'card-slot';
    slot.id = `slot${i}`;
    slot.innerHTML = `
      <div class="slot-label">${info.label}</div>
      <div class="rank-row" id="rr${i}"></div>
      <div class="suit-row" id="sr${i}"></div>
      <div><div class="cd empty" id="cd${i}">?</div></div>
    `;
    container.appendChild(slot);

    const rr = slot.querySelector(`#rr${i}`);
    for (const r of RANKS) {
      const b = document.createElement('button');
      b.className = 'rb'; b.id = `rb${i}${r}`; b.textContent = r;
      b.onclick = () => selectRank(i, r);
      rr.appendChild(b);
    }

    const sr = slot.querySelector(`#sr${i}`);
    for (const s of SUITS) {
      const b = document.createElement('button');
      b.className = 'sb' + (RED.has(s) ? ' red' : '');
      b.id = `sb${i}${s}`; b.textContent = SC[s];
      b.onclick = () => selectSuit(i, s);
      sr.appendChild(b);
    }
  }
  updateSlotEnabled();
}

function updateSlotEnabled() {
  // ターン(3)はフロップ3枚完了後、リバー(4)はターン完了後に有効
  for (let i = 3; i < 5; i++) {
    const prevComplete = board[i-1].r && board[i-1].s;
    const slot = document.getElementById(`slot${i}`);
    if (slot) slot.classList.toggle('disabled', !prevComplete);
  }
}

// ── カード選択 ──────────────────────────────────────────────
function selectRank(i, r) {
  board[i].r = r;
  board[i].s = null;
  refreshSlot(i);
  updateSlotEnabled();
  tryCalculate();
}

function selectSuit(i, s) {
  if (!board[i].r) return;
  const key = board[i].r + s;
  if (usedSet(i).has(key)) return;
  board[i].s = s;
  refreshSlot(i);
  updateSlotEnabled();
  tryCalculate();
}

function refreshSlot(i) {
  const {r, s} = board[i];
  const used   = usedSet(i);

  for (const rk of RANKS) {
    document.getElementById(`rb${i}${rk}`).classList.toggle('active', rk === r);
  }

  for (const su of SUITS) {
    const b = document.getElementById(`sb${i}${su}`);
    const dup = r && used.has(r + su);
    b.classList.toggle('active', su === s);
    b.style.opacity = dup ? '0.12' : '';
    b.style.cursor  = dup ? 'not-allowed' : '';
  }

  const cd = document.getElementById(`cd${i}`);
  if (!r) {
    cd.className = 'cd empty'; cd.innerHTML = '?';
  } else {
    const isRed = s && RED.has(s);
    cd.className = 'cd' + (isRed ? ' rc' : '');
    cd.innerHTML = `<span>${r}</span><span class="sc">${s ? SC[s] : ''}</span>`;
  }

  // 他スロットのスーツ重複禁止を更新
  for (let j = 0; j < 5; j++) { if (j !== i) refreshSuitDisable(j); }
}

function refreshSuitDisable(i) {
  const {r} = board[i];
  const used = usedSet(i);
  for (const su of SUITS) {
    const b = document.getElementById(`sb${i}${su}`);
    if (!b) continue;
    const dup = r && used.has(r + su);
    b.style.opacity = dup ? '0.12' : '';
    b.style.cursor  = dup ? 'not-allowed' : '';
  }
}

function resetAll() {
  for (let i = 0; i < 5; i++) { board[i].r = null; board[i].s = null; }
  buildUI();
  document.getElementById('result').style.display = 'none';
}

// ── 手役評価 ──────────────────────────────────────────────────
const HAND_RANK = {sf:8, quads:7, fh:6, flush:5, str:4, trips:3, twopair:2, pair:1, high:0};

function eval5(cards) {
  const vals  = cards.map(c => c.v).sort((a, b) => b - a);
  const suits = cards.map(c => c.s);
  const isFlush = suits.every(s => s === suits[0]);
  const uniq = [...new Set(vals)];
  let isStraight = false;
  if (uniq.length === 5) {
    if (vals[0] - vals[4] === 4) isStraight = true;
    if (vals[0]===14 && vals[1]===5 && vals[2]===4 && vals[3]===3 && vals[4]===2) isStraight = true;
  }
  const freq = {};
  vals.forEach(v => { freq[v] = (freq[v]||0) + 1; });
  const cnts = Object.values(freq).sort((a, b) => b - a);
  if (isFlush && isStraight) return 'sf';
  if (cnts[0] === 4)                  return 'quads';
  if (cnts[0] === 3 && cnts[1] === 2) return 'fh';
  if (isFlush)                        return 'flush';
  if (isStraight)                     return 'str';
  if (cnts[0] === 3)                  return 'trips';
  if (cnts[0] === 2 && cnts[1] === 2) return 'twopair';
  if (cnts[0] === 2)                  return 'pair';
  return 'high';
}

// N枚から5枚を選ぶ全組み合わせで最強手役を返す
function evalBest5(cards) {
  if (cards.length === 5) return eval5(cards);
  let best = 'high';
  const n = cards.length;
  for (let a = 0; a < n-4; a++)
  for (let b = a+1; b < n-3; b++)
  for (let c = b+1; c < n-2; c++)
  for (let d = c+1; d < n-1; d++)
  for (let e = d+1; e < n;   e++) {
    const h = eval5([cards[a],cards[b],cards[c],cards[d],cards[e]]);
    if (HAND_RANK[h] > HAND_RANK[best]) best = h;
  }
  return best;
}

// ── コンボ計算 ──────────────────────────────────────────────
function calculate(boardCards) {
  const usedKeys  = new Set(boardCards.map(c => c.r + c.s));
  const remaining = FULL_DECK.filter(c => !usedKeys.has(c.r + c.s));
  const counts = {sf:0, quads:0, fh:0, flush:0, str:0, trips:0, twopair:0, pair:0, high:0};

  for (let i = 0; i < remaining.length; i++) {
    for (let j = i+1; j < remaining.length; j++) {
      const hand = evalBest5([remaining[i], remaining[j], ...boardCards]);
      counts[hand]++;
    }
  }
  return counts;
}

// ── 結果描画 ──────────────────────────────────────────────────
const HAND_ROWS = [
  {key:'sf',       label:'ストレートフラッシュ', group:'good'},
  {key:'quads',    label:'フォーカード',         group:'good'},
  {key:'fh',       label:'フルハウス',           group:'good'},
  {key:'flush',    label:'フラッシュ',           group:'good'},
  {key:'str',      label:'ストレート',           group:'good'},
  {key:'trips',    label:'スリーカード',         group:'good'},
  {key:'twopair',  label:'ツーペア',             group:'good'},
  {key:'pair',     label:'ワンペア',             group:'weak'},
  {key:'high',     label:'ノーペア',             group:'weak'},
];

function renderResult(counts, boardCount) {
  const remaining = 52 - boardCount;
  const total     = remaining * (remaining - 1) / 2;
  const stageLabel = boardCount === 3 ? 'フロップ' : boardCount === 4 ? 'ターン' : 'リバー';

  document.getElementById('result').style.display = 'block';
  document.getElementById('result-title').textContent =
    `${stageLabel} — 残り${remaining}枚からのホールカード組み合わせ: ${total.toLocaleString()}通り`;

  const twoPlusKeys = ['sf','quads','fh','flush','str','trips','twopair'];
  const twoPlusTotal = twoPlusKeys.reduce((acc, k) => acc + counts[k], 0);
  const maxVal = Math.max(...Object.values(counts), 1);

  let html = '';
  let prevGroup = null;

  for (const {key, label, group} of HAND_ROWS) {
    const n    = counts[key];
    const pct  = (n / total * 100).toFixed(1);
    const barW = (n / maxVal * 100).toFixed(1);
    const dim  = group === 'weak' ? ' style="color:var(--muted)"' : '';

    if (prevGroup === 'good' && group === 'weak') {
      const tp = twoPlusTotal, tpPct = (tp / total * 100).toFixed(1);
      html += `
        <tr class="twoplus-row">
          <td class="tname hand-name">▶ ツーペア以上 合計</td>
          <td class="num">${tp.toLocaleString()}</td>
          <td class="pct">${tpPct}%</td>
          <td class="bar-cell"><div class="bar-wrap"><div class="bar-fill" style="width:${tpPct}%;background:var(--blue)"></div></div></td>
        </tr>
        <tr class="divider"><td colspan="4"></td></tr>
      `;
    }

    html += `
      <tr class="hand-row ${key}">
        <td class="hand-name"${dim}>${label}</td>
        <td class="num"${dim}>${n.toLocaleString()}</td>
        <td class="pct"${dim}>${pct}%</td>
        <td class="bar-cell"><div class="bar-wrap"><div class="bar-fill" style="width:${barW}%"></div></div></td>
      </tr>
    `;
    prevGroup = group;
  }

  html += `
    <tr class="divider"><td colspan="4"></td></tr>
    <tr class="total-row">
      <td class="hand-name">合計</td>
      <td class="num">${total.toLocaleString()}</td>
      <td class="pct">100%</td>
      <td class="bar-cell"></td>
    </tr>
  `;

  document.getElementById('result-body').innerHTML = html;
}

// ── 自動計算 ─────────────────────────────────────────────────
function tryCalculate() {
  const n = completedCount();
  if (n < 3) return;
  const boardCards = board.slice(0, n).map(c => ({r: c.r, s: c.s, v: RV[c.r]}));
  const counts = calculate(boardCards);
  renderResult(counts, n);
}

// ── 初期化 ───────────────────────────────────────────────────
buildUI();
</script>
</body>
</html>
