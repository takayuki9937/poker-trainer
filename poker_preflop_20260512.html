<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preflop Range Trainer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:#0d0d0f;--surface:#16161a;--surface2:#1e1e24;
    --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.15);
    --text:#f0efe8;--muted:#7a7a8a;
    --red:#e03030;--blue:#2a7be4;--green:#1d9e75;--amber:#d4861a;--accent:#e03030;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:'Syne',sans-serif;min-height:100vh;}
  header{padding:24px 36px 18px;border-bottom:0.5px solid var(--border);display:flex;align-items:baseline;gap:14px;}
  header h1{font-size:21px;font-weight:800;letter-spacing:-0.5px;}
  header span{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:0.08em;text-transform:uppercase;}
  .tabs{display:flex;padding:0 36px;border-bottom:0.5px solid var(--border);}
  .tab{padding:13px 22px;font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0.05em;text-transform:uppercase;color:var(--muted);cursor:pointer;background:none;border:none;border-bottom:2px solid transparent;transition:color .12s,border-color .12s;}
  .tab.active{color:var(--text);border-bottom-color:var(--accent);}
  .tab:hover:not(.active){color:var(--text);}
  .content{padding:26px 36px;max-width:980px;}
  .sl{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px;}
  .pos-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px;}
  .pb{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;letter-spacing:0.05em;padding:6px 13px;background:var(--surface);border:0.5px solid var(--border2);border-radius:4px;color:var(--muted);cursor:pointer;transition:all .1s;}
  .pb:hover{color:var(--text);background:var(--surface2);}
  .pb.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .pb.active-g{background:var(--green);border-color:var(--green);color:#fff;}
  .cards-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;}
  .rank-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
  .rb{font-family:'DM Mono',monospace;font-size:12px;font-weight:500;width:33px;height:33px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:0.5px solid var(--border);border-radius:4px;color:var(--muted);cursor:pointer;transition:all .1s;}
  .rb:hover{color:var(--text);border-color:var(--border2);}
  .rb.active{background:var(--surface2);border-color:var(--border2);color:var(--text);}
  .suit-row{display:flex;gap:5px;}
  .sb{font-size:17px;width:35px;height:35px;display:flex;align-items:center;justify-content:center;background:var(--surface);border:0.5px solid var(--border);border-radius:4px;cursor:pointer;transition:all .1s;opacity:.45;}
  .sb:hover{opacity:.8;border-color:var(--border2);}
  .sb.active{opacity:1;border-color:var(--border2);background:var(--surface2);}
  .sb.red{color:#e03030;}
  .cd{display:inline-flex;align-items:center;justify-content:center;width:48px;height:65px;background:#fff;border-radius:6px;font-size:19px;font-weight:700;margin-top:8px;color:#111;flex-direction:column;line-height:1;font-family:'DM Mono',monospace;}
  .cd .sc{font-size:12px;}
  .cd.rc2{color:#c8230a;}
  .cd.empty{background:var(--surface);color:var(--muted);font-size:14px;border:0.5px dashed var(--border2);}
  .aarea{background:var(--surface);border:0.5px solid var(--border);border-radius:8px;padding:22px;text-align:center;min-height:125px;display:flex;align-items:center;justify-content:center;}
  .aph{color:var(--muted);font-size:13px;font-family:'DM Mono',monospace;}
  .ai{display:flex;flex-direction:column;align-items:center;gap:11px;}
  .hl{font-family:'DM Mono',monospace;font-size:12px;color:var(--muted);}
  .abadge{font-family:'DM Mono',monospace;font-size:24px;font-weight:500;letter-spacing:.03em;padding:9px 28px;border-radius:6px;}
  .abadge.raise{background:rgba(224,48,48,.12);color:var(--red);border:1px solid var(--red);}
  .abadge.threebet{background:rgba(212,134,26,.12);color:var(--amber);border:1px solid var(--amber);}
  .abadge.call{background:rgba(42,123,228,.12);color:var(--blue);border:1px solid var(--blue);}
  .abadge.fold{background:rgba(255,255,255,.03);color:var(--muted);border:.5px solid var(--border2);}
  .adesc{font-size:12px;color:var(--muted);font-family:'DM Mono',monospace;}
  .rg{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;}
  .rc{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:9px;border-radius:3px;}
  .rc.raise{background:var(--red);color:#fff;}
  .rc.threebet{background:var(--amber);color:#fff;}
  .rc.call{background:var(--blue);color:#fff;}
  .rc.fold{background:var(--surface2);color:#3a3a4a;border:.5px solid var(--border);}
  .legend{display:flex;gap:13px;margin-bottom:11px;flex-wrap:wrap;}
  .li{display:flex;align-items:center;gap:5px;font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);}
  .ld{width:12px;height:12px;border-radius:2px;}
  .mode-row{display:flex;gap:6px;margin-bottom:18px;align-items:center;}
  .mlabel{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-right:4px;}
  .mbtn{font-family:'DM Mono',monospace;font-size:11px;padding:5px 12px;background:var(--surface);border:.5px solid var(--border2);border-radius:4px;color:var(--muted);cursor:pointer;transition:all .1s;}
  .mbtn.active{background:var(--surface2);color:var(--text);border-color:var(--text);}
  .rsec{margin-bottom:18px;}
  @media(max-width:600px){
    header,.tabs,.content{padding-left:14px;padding-right:14px;}
    .cards-grid{grid-template-columns:1fr;}
    .rc{font-size:7px;}
  }
  @media(max-width:480px){
    header{padding:14px 16px 10px;}
    header h1{font-size:17px;}
    .tabs{padding:0 10px;}
    .tab{padding:11px 12px;font-size:10px;}
    .content{padding:12px 14px;max-width:100%;}
    .tr-table-wrap{height:200px;max-width:100%;}
    .tr-felt{left:7%;right:7%;top:10%;bottom:10%;}
    .tr-seat-inner{width:36px;height:36px;}
    .tr-seat-pos{font-size:7.5px;}
    .tr-seat-d{font-size:6.5px;}
    .tr-seat-blind{font-size:6px;}
    .tr-center-info{gap:6px;}
    .tr-ctx-label{font-size:8px;}
    .tr-card{width:44px;height:62px;}
    .tr-card-rank{font-size:22px;}
    .tr-card-suit{font-size:12px;}
    .tr-actions{gap:5px;}
    .tr-act-btn{padding:16px 4px;font-size:11px;letter-spacing:.06em;}
    .tr-next{padding:15px;font-size:12px;}
    .tr-opt-row{gap:5px;}
    .pb{font-size:11px;padding:8px 10px;}
    .tr-start-btn{width:100%;padding:16px;font-size:13px;}
    .tr-feedback{font-size:11px;}
    .tr-score-num{font-size:48px;}
    .tr-score-pct{font-size:24px;}
  }
  /* ── training tab ── */
  .tr-progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .tr-progress{flex:1;height:3px;background:var(--surface2);border-radius:2px;}
  .tr-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;}
  .tr-counter{font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);white-space:nowrap;letter-spacing:.05em;}
  /* poker table */
  .tr-table-wrap{position:relative;width:100%;max-width:580px;height:260px;margin:0 auto 18px;user-select:none;}
  .tr-felt{position:absolute;left:9%;right:9%;top:14%;bottom:14%;background:#0e0e12;border:1.5px solid #282834;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .tr-seat{position:absolute;transform:translate(-50%,-50%);z-index:2;}
  .tr-seat-inner{width:50px;height:50px;border-radius:50%;background:#1a1a20;border:1.5px solid #2e2e3e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:9px;font-weight:500;color:#555568;line-height:1.4;text-align:center;letter-spacing:.02em;}
  .tr-seat.s-active .tr-seat-inner{border:2px solid #1d9e75;background:#0a1810;color:#c0ead8;box-shadow:0 0 10px rgba(29,158,117,.25);}
  .tr-seat.s-raiser .tr-seat-inner{border:2px solid #e07020;background:#1a1005;color:#f0d0a0;box-shadow:0 0 10px rgba(224,112,32,.25);}
  /* center hand */
  .tr-center-info{display:flex;flex-direction:column;align-items:center;gap:10px;}
  .tr-ctx-label{font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#4a4a5e;}
  .tr-cards-wrap{display:flex;gap:5px;}
  .tr-card{width:52px;height:74px;border-radius:7px;border:1.5px solid;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-weight:700;transition:outline .2s,filter .2s;}
  .tr-card-rank{font-size:28px;line-height:1;}
  .tr-card-suit{font-size:14px;line-height:1;margin-top:2px;}
  .tr-card.suit-s{background:#1c1c2e;border-color:#5050b0;color:#d0d0f8;}
  .tr-card.suit-h{background:#2e1010;border-color:#a03030;color:#ff9090;}
  .tr-card.suit-d{background:#0e1a30;border-color:#2060c0;color:#70a8ff;}
  .tr-card.suit-c{background:#0e2018;border-color:#206040;color:#58d090;}
  .tr-card.c-ok{outline:2.5px solid #1d9e75;outline-offset:2px;}
  .tr-card.c-ng{filter:brightness(.55);outline:2.5px solid #b03030;outline-offset:2px;}
  /* action buttons */
  .tr-actions{display:flex;gap:7px;margin-bottom:14px;}
  .tr-act-btn{flex:1;font-family:'DM Mono',monospace;font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:15px 8px;border:none;border-radius:5px;color:#fff;cursor:pointer;transition:opacity .1s,filter .1s;}
  .tr-act-btn:hover:not([disabled]){filter:brightness(1.15);}
  .tr-act-btn[disabled]{cursor:not-allowed;filter:brightness(.7);}
  .tr-act-btn.chosen{outline:3px solid rgba(255,255,255,.8);outline-offset:2px;}
  .tr-act-btn.ans-hl{outline:3px solid rgba(255,255,255,.8);outline-offset:2px;filter:brightness(1.2);}
  .tr-act-open{background:#c03030;}
  .tr-act-fold{background:#2a4a8a;}
  .tr-act-3bet{background:#bf5510;}
  .tr-act-call{background:#1d7a50;}
  /* feedback */
  .tr-feedback{display:flex;align-items:center;gap:8px;margin-bottom:14px;font-family:'DM Mono',monospace;flex-wrap:wrap;}
  .tr-ok{font-size:14px;font-weight:500;color:#1d9e75;}
  .tr-ng{font-size:14px;font-weight:500;color:#e03030;}
  .tr-ans-lbl{font-size:11px;color:var(--muted);background:var(--surface);padding:3px 9px;border-radius:4px;border:.5px solid var(--border2);}
  .tr-freq-lbl{font-size:11px;color:var(--muted);background:var(--surface);padding:3px 9px;border-radius:4px;border:.5px solid var(--border);}
  .tr-next{display:block;width:100%;font-family:'DM Mono',monospace;font-size:13px;letter-spacing:.05em;padding:15px 22px;background:var(--surface2);border:.5px solid var(--border2);border-radius:5px;color:var(--text);cursor:pointer;transition:all .1s;text-align:center;}
  .tr-next:hover{background:var(--accent);border-color:var(--accent);}
  .tr-seat-pos{font-size:9px;font-weight:500;letter-spacing:.02em;}
  .tr-seat-d{font-size:8px;color:#ffe066;margin-top:2px;}
  .tr-seat-blind{font-size:7px;color:#80c8a8;margin-top:2px;letter-spacing:0;}

  /* option rows */
  .tr-opt-section{margin-bottom:18px;}
  .tr-opt-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:0;}
  .tr-rake-note{font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);letter-spacing:.06em;margin-bottom:22px;padding:7px 12px;background:var(--surface);border:.5px solid var(--border);border-radius:4px;display:inline-block;}
  /* setup */
  .tr-start-btn{font-family:'DM Mono',monospace;font-size:14px;font-weight:500;letter-spacing:.05em;padding:13px 34px;background:var(--accent);border:none;border-radius:6px;color:#fff;cursor:pointer;margin-top:20px;transition:opacity .1s;}
  .tr-start-btn:hover{opacity:.85;}
  .tr-setup-btn{background:var(--surface2);border:.5px solid var(--border2);color:var(--muted);}
  .tr-setup-btn:hover{opacity:.7;color:var(--text);}
  /* result */
  .tr-score-num{font-family:'DM Mono',monospace;font-size:64px;font-weight:500;line-height:1;letter-spacing:-.03em;}
  .tr-score-pct{font-family:'DM Mono',monospace;font-size:32px;font-weight:500;margin-top:6px;}
  #tr-score-big{margin-bottom:28px;}
  .tr-bd-row{display:flex;gap:16px;align-items:center;margin-bottom:8px;padding:10px 14px;background:var(--surface);border-radius:6px;border:.5px solid var(--border);}
  .tr-bd-act{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;color:var(--text);min-width:50px;}
  .tr-bd-score{font-family:'DM Mono',monospace;font-size:13px;color:var(--muted);min-width:55px;}
  .tr-bd-pct{font-family:'DM Mono',monospace;font-size:13px;font-weight:500;margin-left:auto;}
  #tr-breakdown{max-width:340px;}

</style>
</head>
<body>
<header><h1>Preflop Range Trainer</h1><span>9-max · GTO · 100bb</span></header>
<div class="tabs">
  <button class="tab active" onclick="switchTab('chart')">レンジ表</button>
  <button class="tab" onclick="switchTab('train')">トレーニング</button>
</div>
<div class="content">

  <div id="tab-chart">
    <div class="mode-row">
      <span class="mlabel">シナリオ</span>
      <button class="mbtn active" onclick="setChartMode('rfi',this)">RFI（オープン）</button>
      <button class="mbtn" onclick="setChartMode('3bet',this)">vs RFI（3bet/コール）</button>
    </div>
    <div class="sl" id="cml">ポジション</div>
    <div class="pos-row" id="chart-my-row"></div>
    <div class="rsec" id="chart-raiser-sec" style="display:none">
      <div class="sl">レイザーのポジション</div>
      <div class="pos-row" id="chart-raiser-row"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="rg" id="rg"></div>
  </div>
  <div id="tab-train" style="display:none">
    <!-- setup -->
    <div id="tr-setup">
      <div class="tr-rake-note">レーキ: 5% / 最大4BBキャップ（GTO Wizard 9-max 100bb 基準）</div>

      <div class="tr-opt-section">
        <div class="sl">テーブル</div>
        <div class="tr-opt-row">
          <button class="pb active" id="tr-tbl-9" onclick="setTrainTable('9max',this)">9-max</button>
          <button class="pb"        id="tr-tbl-6" onclick="setTrainTable('6max',this)">6-max (LJ+)</button>
        </div>
      </div>

      <div class="tr-opt-section">
        <div class="sl">シナリオ</div>
        <div class="tr-opt-row">
          <button class="pb active" id="tr-sc-open" onclick="setTrainScenario('open',this)">オープン</button>
          <button class="pb"        id="tr-sc-3bet" onclick="setTrainScenario('3bet',this)">vs RFI（3bet/コール）</button>
          <button class="pb"        id="tr-sc-both" onclick="setTrainScenario('both',this)">両方</button>
        </div>
      </div>

      <div class="tr-opt-section">
        <div class="sl">ハンド</div>
        <div class="tr-opt-row">
          <button class="pb active" id="tr-hnd-all"  onclick="setTrainBorderline(false,this)">全て</button>
          <button class="pb"        id="tr-hnd-edge" onclick="setTrainBorderline(true,this)">際どいのみ</button>
        </div>
      </div>

      <div class="tr-opt-section">
        <div class="sl">ハンド数</div>
        <div class="tr-opt-row" id="tr-count-row">
          <button class="pb active" onclick="setTrainCount(10,this)">10</button>
          <button class="pb" onclick="setTrainCount(20,this)">20</button>
          <button class="pb" onclick="setTrainCount(50,this)">50</button>
          <button class="pb" onclick="setTrainCount(100,this)">100</button>
        </div>
      </div>

      <button class="tr-start-btn" onclick="startTraining()">スタート ▶</button>
    </div>
    <!-- session -->
    <div id="tr-session" style="display:none">
      <div class="tr-progress-wrap">
        <div class="tr-progress"><div class="tr-progress-fill" id="tr-progress-fill" style="width:0%"></div></div>
        <span class="tr-counter" id="tr-counter"></span>
      </div>
      <div class="tr-table-wrap" id="tr-table-wrap">
        <div class="tr-felt">
          <div class="tr-center-info">
            <div class="tr-ctx-label" id="tr-ctx-label"></div>
            <div class="tr-cards-wrap" id="tr-cards-wrap"></div>
          </div>
        </div>
        <!-- seats appended by JS -->
      </div>
      <div class="tr-actions" id="tr-actions"></div>
      <div class="tr-feedback" id="tr-feedback" style="display:none"></div>
      <button class="tr-next" id="tr-next" style="display:none" onclick="nextTrainHand()">次へ →</button>
    </div>
    <!-- result -->
    <div id="tr-result" style="display:none">
      <div id="tr-score-big"></div>
      <div id="tr-breakdown"></div>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="tr-start-btn" onclick="retryTraining()">もう一度 ↺</button>
        <button class="tr-start-btn tr-setup-btn" onclick="showTrainSetup()">設定に戻る ←</button>
      </div>
    </div>
  </div>

</div>

<script>
const R=['A','K','Q','J','T','9','8','7','6','5','4','3','2'];
const SC={s:'♠',h:'♥',d:'♦',c:'♣'};
const REDSUIT=['h','d'];

      const k2=i===j?r1+r2:(i<j?r1+r2+'s':r2+r1+'o');
      const freq=freqs[k2]||0;
      let bg;
      if(freq>=0.999)bg='#e03030';
      else if(freq<=0.001)bg='#2a4a8a';
      else{const p=(freq*100).toFixed(1);bg=`linear-gradient(to right,#e03030 ${p}%,#2a4a8a ${p}%)`;}
      h+=`<div class="rc" style="background:${bg};color:#fff;" title="${k2} ${(freq*100).toFixed(0)}%">${k2.length>3?k2.slice(0,3):k2}</div>`;
    }));
    g.innerHTML=h;
  } else {
    // vs RFI mode
    if(!cs.raiserPos){g.innerHTML='<p style="color:var(--muted);font-size:13px;font-family:\'DM Mono\',monospace;padding:12px 0">レイザーのポジションを選んでください。</p>';leg.innerHTML='';return;}
    leg.innerHTML='<div class="li"><div class="ld" style="background:#e07020"></div>■ オレンジ：3bet</div><div class="li"><div class="ld" style="background:#1d9e75"></div>■ 緑：コール</div><div class="li"><div class="ld" style="background:#1a3a6a"></div>■ 青：フォールド</div>';
    const betFreqs=getVsRfiFreqs(cs.myPos,cs.raiserPos,'3bet');
    const callFreqs=getVsRfiFreqs(cs.myPos,cs.raiserPos,'call');
    let h='';
    R.forEach((r1,i)=>R.forEach((r2,j)=>{
      const k2=i===j?r1+r2:(i<j?r1+r2+'s':r2+r1+'o');
      let b=betFreqs[k2]||0,c=callFreqs[k2]||0;
      if(b+c>1){const t=b+c;b=b/t;c=c/t;}
      const bp=(b*100).toFixed(1),cp=((b+c)*100).toFixed(1);
      let bg;
      if(b>=0.999&&c<=0.001)bg='#e07020';
      else if(b<=0.001&&c>=0.999)bg='#1d9e75';
      else if(b+c<=0.001)bg='#1a3a6a';
      else if(c<=0.001)bg=`linear-gradient(to right,#e07020 ${bp}%,#1a3a6a ${bp}%)`;
      else bg=`linear-gradient(to right,#e07020 ${bp}%,#1d9e75 ${bp}%,#1d9e75 ${cp}%,#1a3a6a ${cp}%)`;
      h+=`<div class="rc" style="background:${bg};color:#fff;" title="${k2} 3bet${(b*100).toFixed(0)}% コール${(c*100).toFixed(0)}%">${k2.length>3?k2.slice(0,3):k2}</div>`;
    }));
    g.innerHTML=h;
  }
}
function switchTab(t){
  document.getElementById('tab-chart').style.display=t==='chart'?'':'none';
  document.getElementById('tab-train').style.display=t==='train'?'':'none';
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',
    (i===0&&t==='chart')||(i===1&&t==='train')));
  if(t==='chart'){buildChartMyPos();buildChartRaiser();renderGrid();}
}

// ===== FLOP WIZARD =====
// Source: GTO Wizard Blog


// フロップ行動順: BTN > CO > HJ > LJ > UTG+2 > UTG+1 > UTG > SB > BB

// ── Training Tab ──
let trainTableSize='9max';  // '9max' | '6max'
let trainScenario='open';   // 'open' | '3bet' | 'both'
let trainBorderline=false;
let trainCount=20;
let trainSession=[], trainIdx=0, trainAnswers=[];

const HANDS=(()=>{const h=[];for(let i=0;i<R.length;i++)for(let j=0;j<R.length;j++){if(i===j)h.push(R[i]+R[j]);else if(i<j)h.push(R[i]+R[j]+'s');else h.push(R[j]+R[i]+'o');}return h;})();

const POS_6MAX=['LJ','HJ','CO','BTN','SB'];

const SEAT_POS={
  UTG:    {l:8,  t:50},
  'UTG+1':{l:24, t:10},
  'UTG+2':{l:44, t:2 },
  LJ:     {l:63, t:2 },
  HJ:     {l:82, t:10},
  CO:     {l:91, t:50},
  BTN:    {l:72, t:84},
  SB:     {l:37, t:92},
  BB:     {l:17, t:84},
};

function initTrainTable(){
  const wrap=document.getElementById('tr-table-wrap');
  POS.forEach(p=>{
    const pos=SEAT_POS[p];
    const d=document.createElement('div');
    d.className='tr-seat';
    d.id='tr-s-'+p.replace(/\+/g,'p');
    d.style.cssText='left:'+pos.l+'%;top:'+pos.t+'%';
    let sub='';
    if(p==='BTN')sub='<div class="tr-seat-d">● D</div>';
    else if(p==='SB')sub='<div class="tr-seat-blind">0.5BB</div>';
    else if(p==='BB')sub='<div class="tr-seat-blind">1BB</div>';
    d.innerHTML='<div class="tr-seat-inner"><div class="tr-seat-pos">'+p+'</div>'+sub+'</div>';
    wrap.appendChild(d);
  });
}

function updateSeats(myPos,raiserPos){
  POS.forEach(p=>{
    const el=document.getElementById('tr-s-'+p.replace(/\+/g,'p'));
    if(!el)return;
    const inUse=trainTableSize==='6max'?POS_6MAX.includes(p)||p==='BB':true;
    el.className='tr-seat'+(p===myPos?' s-active':p===raiserPos?' s-raiser':!inUse?' s-fold':'');
  });
}

function rfiPosList(){
  return trainTableSize==='6max'?POS_6MAX:POS.slice(0,-1); // exclude BB
}

function vsrfiPairs(){
  const openPos=rfiPosList();
  const pairs=[];
  for(let mi=0;mi<openPos.length;mi++)
    for(let ri=0;ri<mi;ri++){
      const mp=openPos[mi],rp=openPos[ri];
      if(rp==='BB')continue;
      if(VSRFI_DATA['toopen_'+posKey(mp)+'_3bet_'+posKey(rp)])
        pairs.push({myPos:mp,raiserPos:rp});
    }
  // BB vs all raisers
  const bbRaisers=trainTableSize==='6max'?['LJ','HJ','CO','BTN','SB']:['UTG','UTG+1','UTG+2','LJ','HJ','CO','BTN','SB'];
  bbRaisers.forEach(rp=>{
    if(VSRFI_DATA['toopen_BB_3bet_'+posKey(rp)])pairs.push({myPos:'BB',raiserPos:rp});
  });
  return pairs;
}

function randomHand(){return HANDS[Math.floor(Math.random()*HANDS.length)];}

// ── Borderline: 13×13グリッドの各行で境界ハンドを探し、その上下N手を収集 ──
const BORDER_N=2;

// 13×13グリッドの行i（左＝強、右＝弱）を返す
function gridRow(i){
  const row=[];
  for(let j=0;j<13;j++){
    if(i===j)row.push(R[i]+R[j]);         // ペア
    else if(i<j)row.push(R[i]+R[j]+'s'); // スーテッド（行ランク > 列ランク）
    else row.push(R[j]+R[i]+'o');          // オフスート
  }
  return row;
}

// オープン/フォールドの境界: 各行でアクションが変わる列を探し、
// その手の左BORDER_N手（最弱オープン）と右BORDER_N手（最強フォールド）を収集
function getBorderlineOpen(pos){
  const freqs=getRangeFreqs(pos);
  const pool=new Set();
  for(let i=0;i<13;i++){
    const row=gridRow(i);
    for(let j=0;j<row.length-1;j++){
      const cur=(freqs[row[j]]||0)>=0.5;
      const nxt=(freqs[row[j+1]]||0)>=0.5;
      if(cur!==nxt){
        // 境界発見: j と j+1 の間
        for(let k=Math.max(0,j-BORDER_N+1);k<=j;k++)pool.add(row[k]);
        for(let k=j+1;k<=Math.min(row.length-1,j+BORDER_N);k++)pool.add(row[k]);
      }
    }
  }
  return pool.size?[...pool]:HANDS;
}

// vs RFI: 3bet/call と call/fold の両境界を各行でグリッドスキャン
function getBorderline3bet(myPos,raiserPos){
  const pool=new Set();
  const b3c=getVsRfiFreqs(myPos,raiserPos,'3bet');
  const cc=getVsRfiFreqs(myPos,raiserPos,'call');
  function act(h){const b=b3c[h]||0,c=cc[h]||0;return b+c<0.1?'fold':b>=c?'3bet':'call';}
  for(let i=0;i<13;i++){
    const row=gridRow(i);
    const acts=row.map(act);
    for(let j=0;j<row.length-1;j++){
      if(acts[j]!==acts[j+1]){
        for(let k=Math.max(0,j-BORDER_N+1);k<=j;k++)pool.add(row[k]);
        for(let k=j+1;k<=Math.min(row.length-1,j+BORDER_N);k++)pool.add(row[k]);
      }
    }
  }
  return pool.size?[...pool]:HANDS;
}

function generateOpenQ(){
  const poses=rfiPosList();
  const pos=poses[Math.floor(Math.random()*poses.length)];
  const pool=trainBorderline?getBorderlineOpen(pos):HANDS;
  const hand=pool[Math.floor(Math.random()*pool.length)];
  const freq=getRangeFreqs(pos)[hand]||0;
  return{type:'open',pos,hand,openFreq:freq,action:freq>=0.5?'open':'fold'};
}

function generate3betQ(){
  const pairs=vsrfiPairs();
  if(!pairs.length)return generateOpenQ();
  const pair=pairs[Math.floor(Math.random()*pairs.length)];
  const{myPos,raiserPos}=pair;
  const pool=trainBorderline?getBorderline3bet(myPos,raiserPos):HANDS;
  const hand=pool[Math.floor(Math.random()*pool.length)];
  const b=getVsRfiFreqs(myPos,raiserPos,'3bet')[hand]||0;
  const c=getVsRfiFreqs(myPos,raiserPos,'call')[hand]||0;
  return{type:'3bet',pos:myPos,raiserPos,hand,bFreq:b,cFreq:c,action:b+c<0.1?'fold':b>=c?'3bet':'call'};
}

function generateQuestion(){
  if(trainScenario==='open')return generateOpenQ();
  if(trainScenario==='3bet')return generate3betQ();
  return Math.random()<0.5?generateOpenQ():generate3betQ();
}

function handToCards(h){
  const suits=['s','h','d','c'];
  const rnd=()=>Math.floor(Math.random()*4);
  if(h.length===2){
    const i=rnd();let j;do{j=rnd();}while(j===i);
    return[{r:h[0],s:suits[i]},{r:h[0],s:suits[j]}];
  }
  if(h.endsWith('s')){
    const s=suits[rnd()];
    return[{r:h[0],s},{r:h[1],s}];
  }
  const i=rnd();let j;do{j=rnd();}while(j===i);
  return[{r:h[0],s:suits[i]},{r:h[1],s:suits[j]}];
}

const ACT_LABELS={open:'OPEN',fold:'FOLD','3bet':'3BET',call:'CALL'};

function startTraining(){
  trainSession=Array.from({length:trainCount},generateQuestion);
  trainIdx=0;trainAnswers=[];
  document.getElementById('tr-setup').style.display='none';
  showTrainQuestion();
}

function showTrainQuestion(){
  document.getElementById('tr-result').style.display='none';
  document.getElementById('tr-session').style.display='';
  const q=trainSession[trainIdx];
  document.getElementById('tr-progress-fill').style.width=(trainIdx/trainCount*100)+'%';
  document.getElementById('tr-counter').textContent=(trainIdx+1)+' / '+trainCount;
  document.getElementById('tr-ctx-label').textContent=
    q.raiserPos?q.pos+' — vs '+q.raiserPos+' open':q.pos+' — RFI';
  updateSeats(q.pos,q.raiserPos||null);
  const SC2={s:'♠',h:'♥',d:'♦',c:'♣'};
  const cards=handToCards(q.hand);
  document.getElementById('tr-cards-wrap').innerHTML=cards.map(c=>
    `<div class="tr-card suit-${c.s}"><div class="tr-card-rank">${c.r}</div><div class="tr-card-suit">${SC2[c.s]}</div></div>`
  ).join('');
  const acts=q.type==='open'?['open','fold']:['3bet','call','fold'];
  document.getElementById('tr-actions').innerHTML=acts.map(a=>
    `<button class="tr-act-btn tr-act-${a}" onclick="answerTrain('${a}')">${ACT_LABELS[a]}</button>`
  ).join('');
  document.getElementById('tr-feedback').style.display='none';
  document.getElementById('tr-next').style.display='none';
}

function isCorrect(ans,q){
  const T=0.01;
  if(q.type==='open'){
    if(ans==='open')return(q.openFreq||0)>=T;
    if(ans==='fold')return(1-(q.openFreq||0))>=T;
    return false;
  }
  const b=q.bFreq||0,c=q.cFreq||0,f=Math.max(0,1-b-c);
  if(ans==='3bet')return b>=T;
  if(ans==='call')return c>=T;
  if(ans==='fold')return f>=T;
  return false;
}

function answerTrain(ans){
  const q=trainSession[trainIdx];
  const correct=isCorrect(ans,q);
  trainAnswers.push({correct,myAns:ans,correctAns:q.action,type:q.type});
  document.querySelectorAll('.tr-act-btn').forEach(b=>{
    b.disabled=true;
    const k=Object.keys(ACT_LABELS).find(k2=>ACT_LABELS[k2]===b.textContent);
    if(k===q.action)b.classList.add('ans-hl');
    else if(k===ans&&!correct)b.classList.add('chosen');
  });
  document.querySelectorAll('.tr-card').forEach(c=>c.classList.add(correct?'c-ok':'c-ng'));
  const fb=document.getElementById('tr-feedback');
  fb.style.display='';
  let fh=correct
    ?'<span class="tr-ok">✓ 正解</span>'
    :'<span class="tr-ng">✗ 不正解</span><span class="tr-ans-lbl">正解: '+ACT_LABELS[q.action]+'</span>';
  if(q.type==='open'){
    const freq=getRangeFreqs(q.pos)[q.hand]||0;
    fh+='<span class="tr-freq-lbl">オープン頻度 '+(freq*100).toFixed(0)+'%</span>';
  }else{
    const b=getVsRfiFreqs(q.pos,q.raiserPos,'3bet')[q.hand]||0;
    const c=getVsRfiFreqs(q.pos,q.raiserPos,'call')[q.hand]||0;
    fh+='<span class="tr-freq-lbl">3bet '+(b*100).toFixed(0)+'% / コール '+(c*100).toFixed(0)+'% / フォールド '+Math.max(0,100-Math.round((b+c)*100))+'%</span>';
  }
  fb.innerHTML=fh;
  const nb=document.getElementById('tr-next');
  nb.textContent=trainIdx+1>=trainCount?'結果を見る ▶':'次へ →';
  nb.style.display='';
}

function nextTrainHand(){
  if(++trainIdx>=trainCount)showTrainResult();
  else showTrainQuestion();
}

function showTrainResult(){
  document.getElementById('tr-session').style.display='none';
  document.getElementById('tr-result').style.display='';
  const ok=trainAnswers.filter(a=>a.correct).length;
  const pct=Math.round(ok/trainCount*100);
  const col=pct>=80?'#1d9e75':pct>=60?'#d4861a':'#e03030';
  document.getElementById('tr-score-big').innerHTML=
    `<div class="tr-score-num" style="color:${col}">${ok} / ${trainCount}</div>`+
    `<div class="tr-score-pct" style="color:${col}">${pct}%</div>`;
  // breakdown by action type
  const allActs=['open','3bet','call','fold'];
  document.getElementById('tr-breakdown').innerHTML=allActs.map(a=>{
    const tot=trainAnswers.filter(x=>x.correctAns===a).length;
    if(!tot)return'';
    const c=trainAnswers.filter(x=>x.correctAns===a&&x.correct).length;
    return `<div class="tr-bd-row"><span class="tr-bd-act">${ACT_LABELS[a]}</span><span class="tr-bd-score">${c} / ${tot}</span><span class="tr-bd-pct">${Math.round(c/tot*100)}%</span></div>`;
  }).join('');
}

function retryTraining(){startTraining();}
function showTrainSetup(){
  ['tr-session','tr-result'].forEach(id=>document.getElementById(id).style.display='none');
  document.getElementById('tr-setup').style.display='';
}
function setTrainTable(v,btn){
  trainTableSize=v;
  document.querySelectorAll('#tr-setup #tr-tbl-9,#tr-setup #tr-tbl-6').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function setTrainScenario(v,btn){
  trainScenario=v;
  document.querySelectorAll('#tr-setup #tr-sc-open,#tr-setup #tr-sc-3bet,#tr-setup #tr-sc-both').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function setTrainBorderline(v,btn){
  trainBorderline=v;
  document.querySelectorAll('#tr-setup #tr-hnd-all,#tr-setup #tr-hnd-edge').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function setTrainCount(n,btn){
  trainCount=n;
  document.querySelectorAll('#tr-count-row .pb').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}

cs.myPos='UTG';buildChartMyPos();renderGrid();
initTrainTable();
